version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: campus-trade-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-campus_trade}
      MYSQL_CHARSET: utf8mb4
    volumes:
      - /app/mysql:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci --character-set-client-handshake=FALSE --init-connect='SET NAMES utf8mb4' --default-time-zone='+08:00'
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - campus-trade

  redis:
    image: redis/redis-stack-server:7.2.0-v10
    container_name: campus-trade-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123} --notify-keyspace-events Ex --appendonly yes --appendfsync everysec
    volumes:
      - /app/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - campus-trade

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: campus-trade-rabbitmq
    ports:
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - campus-trade

  backend:
    build:
      context: ./campus-trade-server
      dockerfile: Dockerfile
    container_name: campus-trade-backend
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      MYSQL_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-campus_trade}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      MYSQL_USERNAME: ${MYSQL_USERNAME:-root}
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      JWT_SECRET: ${JWT_SECRET:-CampusTradeSecretKey2026ForJwtTokenGenerationAndValidation}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-7200000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:81,http://localhost:5173,http://localhost:5174,http://61.139.2.140,http://61.139.2.140:81}
      AI_DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      AI_DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      AI_DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      AI_ENABLED: ${AI_ENABLED:-true}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx1024m -XX:+UseG1GC -Duser.timezone=Asia/Shanghai}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - /app/logs:/app/logs
      - /app/upload:/data/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    networks:
      - campus-trade

  frontend-user:
    image: nginx:alpine
    container_name: campus-trade-frontend-user
    ports:
      - "${FRONTEND_USER_PORT:-80}:80"
    volumes:
      - ./campus-trade-user/dist:/usr/share/nginx/html
      - ./nginx/user.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - campus-trade

  frontend-admin:
    image: nginx:alpine
    container_name: campus-trade-frontend-admin
    ports:
      - "${FRONTEND_ADMIN_PORT:-81}:80"
    volumes:
      - ./campus-trade-admin/dist:/usr/share/nginx/html
      - ./nginx/admin.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - campus-trade

  prometheus:
    image: prom/prometheus:v2.45.4
    container_name: campus-trade-prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - /app/prometheus:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    restart: unless-stopped
    networks:
      - campus-trade

  grafana:
    image: grafana/grafana:10.4.0
    container_name: campus-trade-grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - /app/grafana:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - campus-trade

networks:
  campus-trade:
    driver: bridge
